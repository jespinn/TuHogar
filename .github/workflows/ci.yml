# integración continua: compila y prueba en cada push y pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # base de datos para las pruebas
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: alojamientos_test
          POSTGRES_USER: alojamientos
          POSTGRES_PASSWORD: clave-de-prueba
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U alojamientos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pruebas del backend
        working-directory: backend
        env:
          DB_PASSWORD: clave-de-prueba
        run: mvn -B test
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
