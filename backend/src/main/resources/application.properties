spring.application.name=alojamientos

# lee las claves del archivo .env de la raíz del proyecto (si existe)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# conexión a postgresql 17 (docker compose up -d db)
# en Render llegan DB_HOST, DB_PORT y DB_NAME por separado
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:alojamientos}}
server.port=${PORT:8080}
spring.datasource.username=${DB_USER:alojamientos}
spring.datasource.password=${DB_PASSWORD:}
# carga inicial
spring.sql.init.mode=${SQL_INIT:never}
spring.sql.init.encoding=UTF-8
# en Render: crea el esquema si falta y carga datos solo con la base vacia
app.db.inicializar=${DB_INICIALIZAR:false}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# clave jwt
app.jwt.secreto=${JWT_SECRETO:}
app.jwt.minutos=30

# orígenes del frontend
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}


# configuración del log
logging.file.name=logs/aplicacion.log

